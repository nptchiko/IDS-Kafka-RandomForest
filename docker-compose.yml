
services:
  zeek:
    image: zeek/zeek
    volumes:
        - ./zeek/extract_logs.zeek:/usr/share/zeek/site/extract_logs.zeek
        - ./data/logs/:/zeek/logs
    cap_add:
        - NET_RAW
    container_name: zeek_container
    network_mode: host
    command: "bash -c 'mkdir -p /zeek/logs && cd /zeek/logs && zeek -i any local /usr/share/zeek/site/extract_logs.zeek'"

  
  zeek-log-merger:
    build: ./zeek/merging-logs
    network_mode: host
    volumes:
      - ./data/logs:/logs 
    restart: unless-stopped
    
  mongoserver:
    image: mongo:latest
    hostname: mongodb
    container_name: mongoserver
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_DATABASE=admin
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
      - ./infras/db/mongo-entrypoint:/docker-entrypoint-initdb.d
      - mongodb:/data/db
      - mongoconfig:/data/configdb
    networks:
      - kafka_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: zookeeper
    networks:
      - kafka_network
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    healthcheck:
      test: ["CMD", "zookeeper-shell", "localhost:2181", "ls", "/"]
      interval: 30s
      timeout: 10s
      retries: 3


  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    networks:
      - kafka_network
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL_SAME_HOST://0.0.0.0:29092,EXTERNAL_DIFFERENT_HOST://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL_SAME_HOST://localhost:29092,EXTERNAL_DIFFERENT_HOST://157.245.88.232:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL_SAME_HOST:PLAINTEXT,EXTERNAL_DIFFERENT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1      
    
    #   command: "bash -c 'echo Waiting for kafka to create topic && \
    #              sleep 20 && \
    #              kafka-topics --bootstrap-server kafka:9092 --topic zeek_logs --create --partitions 3 --replication-factor 1 --if-not-exists '"

  
  model:
    container_name: model
    depends_on:
      - kafka
    build: 
      context: ./infras/model
      dockerfile: Dockerfile
    environment:        
      - TZ=Asia/Ho_Chi_Minh
      - BOOTSTRAP_SERVERS=kafka:9092
      - INPUT_TOPIC=zeek-logs
      - OUTPUT_TOPIC=alert
      - MODEL_PATH=/app/RandomForestModel.sav
    networks:
      - kafka_network
    command: "bash -c 'echo Waiting for kafka to deploy.. && sleep 10 && exec /app/entrypoint.sh'"

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8088:8080
    networks:
        - kafka_network
    depends_on:
      - kafka 
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: first
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: 'true'

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.2.1
    container_name: init-topics
    depends_on:
      - kafka
    networks:
      - kafka_network 
    command: "bash -c 'echo Waiting for Kafka to be ready... && \
               kafka-topics --create --topic zeek-logs --partitions 3 --replication-factor 1 --if-not-exists --bootstrap-server kafka:9092 && \
               kafka-topics --create --topic alert --partitions 3 --replication-factor 1 --if-not-exists --bootstrap-server kafka:9092 && \ 
               kafka-console-consumer --bootstrap-server kafka:9092 --topic zeek-logs --from-beginning --group zeek-log-consumer-group'"
  
    
  connect: 
    container_name: connect
    # image: confluentinc/cp-kafka-connect:5.5.0
    hostname: connect
    build:
      context: ./kafka/kafka-connect/
      dockerfile: Dockerfile
    ports:
        - "8083:8083"
    volumes:
      - ./data:/zeek
    networks:
      - kafka_network
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: "connect"
      CONNECT_GROUP_ID: "connect"
      CONNECT_CONFIG_STORAGE_TOPIC: "connect-config"
      CONNECT_OFFSET_STORAGE_TOPIC: "connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
      CONNECT_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_PLUGIN_PATH: /usr/share/java
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
      CONNECT_LOG4J_LOGGERS: org.reflections=ERROR
    depends_on:
    - kafka
    - zookeeper
    restart: unless-stopped

    # command:
    #   - bash
    #   - -c 
    #   - | 
    #     confluent-hub install --no-prompt --component-dir /usr/share/java mongodb/kafka-connect-mongodb:1.11.2
    #     /etc/confluent/docker/run
  websocket-server:
    container_name: websocket
    hostname: websocket
    build:
      context: ./infras/websocket
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - kafka_network
    command: gunicorn --worker-class eventlet -w 1 server:app --bind 0.0.0.0:5000 --log-level info

  
  vite-app:
    container_name: vite-app
    build: 
      context: ./infras/web-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./infras/web-ui:/app
      - vite_node_modules:/app/node_modules
    # command: npm run dev
    depends_on:
      - websocket-server
    networks:
      - kafka_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb:
  mongoconfig:
  vite_node_modules:

networks:
  kafka_network:
    name: kafka_network
  
