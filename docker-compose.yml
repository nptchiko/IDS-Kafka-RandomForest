version: "3.8"

services:
  zeek:
    image: zeek/zeek
    volumes:
        - .zeek/extract_logs.zeek:/usr/share/zeek/site/extract_logs.zeek
        - ./data/logs/:/zeek/logs
    cap_add:
        - NET_RAW
    container_name: zeek_container
    network_mode: host

    command: "bash -c 'mkdir -p /zeek/logs && cd /zeek/logs && zeek -i any local /usr/share/zeek/site/extract_logs.zeek'"

  websocket-server:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - app-network
  
  vite-app:
    build: 
      context: ./web-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./web-ui:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - websocket-server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge


